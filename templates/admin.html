// Edit a knowledge point
async function editKnowledgePoint(point) {
    const newName = window.prompt(
        "Edit knowledge point name:",
        point.name
    );

    if (newName === null) return;

    const newDescription = window.prompt(
        "Edit description:",
        point.description
    );

    if (newDescription === null) return;

    try {
        const response = await fetch(
            `/api/admin/knowledge-points/${point.id}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    course_code: courseSelect.value,
                    name: newName,
                    description: newDescription
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Update failed.");
        }

        await loadKnowledgePoints();
        message.textContent = data.message;

    } catch (error) {
        message.textContent = error.message;
        window.alert(error.message);
    }
}


// Delete a knowledge point
async function deleteKnowledgePoint(point) {
    const confirmed = window.confirm(
        `Delete "${point.name}"?\n\n` +
        "Its aliases and PDF mappings will also be deleted."
    );

    if (!confirmed) return;

    try {
        const params = new URLSearchParams({
            course: courseSelect.value
        });

        const response = await fetch(
            `/api/admin/knowledge-points/${point.id}?${params}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Deletion failed.");
        }

        await loadKnowledgePoints();
        message.textContent = data.message;

    } catch (error) {
        message.textContent = error.message;
        window.alert(error.message);
    }
}

// Send requests to the alias API
async function aliasRequest(url, method = "GET", body = null) {
    const options = { method };

    if (body !== null) {
        options.headers = {
            "Content-Type": "application/json"
        };
        options.body = JSON.stringify(body);
    }

    const response = await fetch(url, options);
    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.error || "Alias operation failed.");
    }

    return data;
}


// Display and manage aliases for one knowledge point
async function loadAliases(point, panel) {
    panel.replaceChildren();

    const courseCode = courseSelect.value;
    const baseUrl =
        `/api/admin/knowledge-points/${point.id}/aliases`;

    try {
        const params = new URLSearchParams({
            course: courseCode
        });

        const data = await aliasRequest(`${baseUrl}?${params}`);

        const heading = document.createElement("strong");
        heading.textContent = `Aliases for ${point.name}`;
        panel.appendChild(heading);

        if (data.results.length === 0) {
            const empty = document.createElement("p");
            empty.textContent = "No aliases recorded.";
            panel.appendChild(empty);
        }

        for (const item of data.results) {
            const row = document.createElement("div");
            row.style.marginTop = "12px";

            const name = document.createElement("span");
            name.textContent = item.alias + "  ";
            row.appendChild(name);

            const edit = document.createElement("button");
            edit.type = "button";
            edit.textContent = "Edit Alias";
            edit.style.marginLeft = "12px";

            edit.addEventListener("click", async function () {
                const newAlias = window.prompt(
                    "Edit alias:", item.alias
                );

                if (newAlias === null) return;

                try {
                    const result = await aliasRequest(
                        `${baseUrl}/${item.id}`,
                        "PUT",
                        {
                            course_code: courseCode,
                            alias: newAlias
                        }
                    );

                    message.textContent = result.message;
                    await loadAliases(point, panel);

                } catch (error) {
                    message.textContent = error.message;
                }
            });

            const remove = document.createElement("button");
            remove.type = "button";
            remove.textContent = "Delete Alias";
            remove.style.background = "#a33c3c";
            remove.style.marginLeft = "8px";

            remove.addEventListener("click", async function () {
                const confirmed = window.confirm(
                    `Delete alias "${item.alias}"?`
                );

                if (!confirmed) return;

                try {
                    const result = await aliasRequest(
                        `${baseUrl}/${item.id}?${params}`,
                        "DELETE"
                    );

                    message.textContent = result.message;
                    await loadAliases(point, panel);

                } catch (error) {
                    message.textContent = error.message;
                }
            });

            row.appendChild(edit);
            row.appendChild(remove);
            panel.appendChild(row);
        }

        const add = document.createElement("button");
        add.type = "button";
        add.textContent = "Add Alias";

        add.addEventListener("click", async function () {
            const newAlias = window.prompt(
                `New alias for ${point.name}:`
            );

            if (newAlias === null) return;

            try {
                const result = await aliasRequest(
                    baseUrl,
                    "POST",
                    {
                        course_code: courseCode,
                        alias: newAlias
                    }
                );

                message.textContent = result.message;
                await loadAliases(point, panel);

            } catch (error) {
                message.textContent = error.message;
            }
        });

        panel.appendChild(add);

    } catch (error) {
        panel.textContent = error.message;
    }
}

// Update one PDF page mapping
async function editPDFLocation(point, location, panel) {
    const newPageText = window.prompt(
        "Enter the new PDF page number:",
        String(location.page_number)
    );

    if (newPageText === null) return;

    const newPage = Number(newPageText);

    if (!Number.isInteger(newPage) || newPage < 1) {
        window.alert("Please enter a positive whole number.");
        return;
    }

    const newNote = window.prompt(
        "Edit the location note:",
        location.note || ""
    );

    if (newNote === null) return;

    try {
        const response = await fetch(
            `/api/admin/knowledge-points/${point.id}` +
            `/locations/${location.id}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    course_code: courseSelect.value,
                    page_number: newPage,
                    note: newNote
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Unable to update PDF location."
            );
        }

        message.textContent = data.message;
        await loadPDFLocations(point, panel);

    } catch (error) {
        message.textContent = error.message;
        window.alert(error.message);
    }
}

// Edit a PDF resource
async function editPDFResource(resource) {
    const title = window.prompt(
        "Edit PDF title:",
        resource.title
    );
    if (title === null) return;

    const fileUrl = window.prompt(
        "Edit PDF file URL:",
        resource.file_url
    );
    if (fileUrl === null) return;

    const pagesText = window.prompt(
        "Edit total pages:",
        String(resource.total_pages)
    );
    if (pagesText === null) return;

    const totalPages = Number(pagesText);

    if (
        pagesText.trim() === "" ||
        !Number.isInteger(totalPages) ||
        totalPages < 1
    ) {
        window.alert("Total pages must be a positive integer.");
        return;
    }

    const status = document.getElementById("resourceMessage");

    try {
        const response = await fetch(
            `/api/admin/resources/${resource.id}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    course_code: courseSelect.value,
                    title: title,
                    file_url: fileUrl,
                    total_pages: totalPages
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Update failed.");
        }

        await loadResources();
        status.textContent = data.message;

    } catch (error) {
        status.textContent = error.message;
        window.alert(error.message);
    }
}

        window.alert(error.message);
    }
}

                event.preventDefault();

                const nameInput = document.getElementById("name");
                const descriptionInput =
                    document.getElementById("description");

                message.textContent = "Saving...";

                try {
                    const response = await fetch(
                        "/api/admin/knowledge-points",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                course_code: courseSelect.value,
                                name: nameInput.value,
                                description: descriptionInput.value
                            })
                        }
                    );

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            data.error || "Unable to save."
                        );
                    }

                    nameInput.value = "";
                    descriptionInput.value = "";

                    await loadKnowledgePoints();
                    message.textContent = data.message;

                } catch (error) {
                    message.textContent = error.message;
                }
            });

        courseSelect.addEventListener("change", function () {
            message.textContent = "";
            loadKnowledgePoints();
        });

        loadCourses();
    </script>
</body>
</html>
